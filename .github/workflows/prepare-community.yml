name: Prepare community source
on:
  push:
    paths: ['.bootstrap/productionize.py', '.github/workflows/prepare-community.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Remove trial lab and record normal source files
        run: |
          set -euo pipefail
          python3 .bootstrap/productionize.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove trial-only hardware controls; keep tested lighting engine unchanged'
          git push
      - name: Pure Java and source checks
        run: |
          set -euo pipefail
          bash tools/test-core.sh | tee /tmp/core.log
          java tools/JavaSyntaxCheck.java app/src/main/java
          java tools/JavaSyntaxCheck.java app/src/androidTest/java
          python3 tools/check-source.py
      - name: Configure Android SDK and compile
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          "$MANAGER" 'platforms;android-36' 'build-tools;35.0.0'
          bash gradlew --no-daemon --console=plain :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest 2>&1 | tee /tmp/build.log
          bash gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > /tmp/dependencies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-source-checks
          path: |
            /tmp/core.log
            /tmp/build.log
            /tmp/dependencies.txt
            app/build/reports/
          retention-days: 14
