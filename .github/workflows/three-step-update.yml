name: Apply three-step onboarding update
on:
  push:
    branches: [main]
    paths: ['.release/three-step/**', '.github/workflows/three-step-update.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: three-step-migration
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'jasonlok000/titan2-nightkeys' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Apply only the requested setup and illustration changes
        run: |
          set -euo pipefail
          grep -qx 'versionName=1.0.0-beta.1' version.properties
          sha256sum app/src/main/java/com/everyonesniche/nightkeys/core/LightPolicy.java app/src/main/java/com/everyonesniche/nightkeys/core/BacklightSession.java app/src/main/java/com/everyonesniche/nightkeys/hardware/*.java app/src/main/java/com/everyonesniche/nightkeys/bridge/*.java .signing/certificate.sha256 > /tmp/engine.sha256
          python3 .release/three-step/app.py
          python3 .release/three-step/site.py
          sha256sum -c /tmp/engine.sha256
          bash tools/test-core.sh
          python3 tools/check-source.py
          python3 tools/check-site.py
          java tools/JavaSyntaxCheck.java app/src/main/java
          java tools/JavaSyntaxCheck.java app/src/androidTest/java
          git diff --check
      - name: Commit normal editable source and retire the one-time importer
        run: |
          set -euo pipefail
          rm -rf .release/three-step
          rm .github/workflows/three-step-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'NightKeys beta.2: install, authorize, enable; accurate Titan 2 Elite demo'
          git push origin HEAD:main
          echo "Published editable source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Start full Android and website validation on the new source
        run: gh workflow run ci.yml --ref main --repo jasonlok000/titan2-nightkeys
      - name: Deploy updated website when Pages is configured
        run: gh workflow run pages.yml --ref main --repo jasonlok000/titan2-nightkeys
