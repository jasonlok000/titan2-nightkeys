name: Prepare beta.2 release verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-beta2-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  prepare:
    if: github.repository == 'jasonlok000/titan2-nightkeys' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Preserve recovery access without changing the lighting engine
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/everyonesniche/nightkeys/ui/MainActivity.java')
          s=p.read_text()
          old='authorize.setEnabled(installed && !active && !pending);'
          assert s.count(old)==1
          s=s.replace(old, '// Reconnection must remain available if a session needs restoration.\n        authorize.setEnabled(installed);')
          # This periodic UI refresh is not a test countdown.
          s=s.replace('Runnable countdown =', 'Runnable uiRefresh =').replace('countdown.run()', 'uiRefresh.run()').replace('removeCallbacks(countdown)', 'removeCallbacks(uiRefresh)')
          p.write_text(s)
          p=Path('tools/check-source.py')
          s=p.read_text()+"\nassert 'authorize.setEnabled(installed);' in (main/'java/com/everyonesniche/nightkeys/ui/MainActivity.java').read_text(), 'Recovery must not block Shizuku reconnect'\n"
          p.write_text(s)
          PY
          bash tools/test-core.sh
          python3 tools/check-source.py
          java tools/JavaSyntaxCheck.java app/src/main/java
          git diff --check
          rm .github/workflows/prepare-beta2-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep Shizuku reconnect available for pending recovery; retain three-step setup'
          git push origin HEAD:main
          gh workflow run ci.yml --ref main --repo jasonlok000/titan2-nightkeys
      - name: Export official Android signing tools for offline maintainer signing
        run: |
          set -euo pipefail
          bash tools/setup-sdk.sh
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p signing-tools
          cp "$SDK/build-tools/35.0.0/lib/apksigner.jar" signing-tools/
          cp "$SDK/build-tools/35.0.0/zipalign" signing-tools/
          printf '%s\n' 'Unmodified Android SDK Build-Tools 35.0.0 signing/verification utilities.' 'No keystore, passwords or private signing material is present.' > signing-tools/README.txt
          (cd signing-tools && sha256sum apksigner.jar zipalign > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: android-offline-signing-tools-35
          path: signing-tools/
          retention-days: 7
