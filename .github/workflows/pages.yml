name: Deploy Titan Tools
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 tools/check-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with: {path: site}
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Owner setup hint
        if: failure()
        run: echo 'If Pages is not enabled, an owner must open Settings → Pages → Source → GitHub Actions, then rerun this workflow. No personal token is needed for normal deployment.' >> "$GITHUB_STEP_SUMMARY"
