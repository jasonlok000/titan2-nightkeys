plugins { id 'com.android.application' }
def version = new Properties()
rootProject.file('version.properties').withInputStream { version.load(it) }
android {
    namespace 'com.everyonesniche.nightkeys'
    compileSdk 36
    defaultConfig {
        applicationId 'com.everyonesniche.nightkeys'
        minSdk 36
        targetSdk 36
        versionCode version.getProperty('versionCode').toInteger()
        versionName version.getProperty('versionName')
        testInstrumentationRunner 'com.everyonesniche.nightkeys.bridge.PermissionTests'
    }
    buildFeatures { aidl true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        releaseKey {
            if (System.getenv('NIGHTKEYS_KEYSTORE')) {
                storeFile file(System.getenv('NIGHTKEYS_KEYSTORE'))
                storePassword System.getenv('NIGHTKEYS_STORE_PASSWORD')
                keyAlias System.getenv('NIGHTKEYS_KEY_ALIAS') ?: 'nightkeys'
                keyPassword System.getenv('NIGHTKEYS_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-dev' }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            if (System.getenv('NIGHTKEYS_KEYSTORE')) signingConfig signingConfigs.releaseKey
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
